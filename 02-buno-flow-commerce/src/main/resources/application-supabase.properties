# ONLY for the dedicated pre-initialized Supabase project buno-flow-commerce.
# The database's V1, V2 and V3 tables were bootstrapped through Supabase SQL migration.
# Flyway must baseline the existing nonempty schema at version 3, then apply V4+.
# Never enable this profile for a fresh database that has partial/unreviewed schema.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3
spring.flyway.baseline-description=Existing Supabase bootstrap V1-V3
spring.flyway.schemas=flow_commerce
spring.flyway.default-schema=flow_commerce
spring.flyway.clean-disabled=true
commerce.cors-origin=${COMMERCE_CORS_ORIGIN}
management.health.mail.enabled=false

# Fail closed: until a pilot invite secret is configured, registration returns 503.
commerce.pilot-only=true
commerce.pilot-invite-code=${COMMERCE_PILOT_INVITE_CODE:}
