server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders?currentSchema=flow_commerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:8}
spring.flyway.enabled=true
spring.flyway.schemas=flow_commerce
spring.flyway.default-schema=flow_commerce
spring.flyway.create-schemas=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
commerce.cors-origin=${COMMERCE_CORS_ORIGIN:http://localhost:5173}

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

commerce.ml.pilot-enabled=${COMMERCE_ML_PILOT_ENABLED:false}
commerce.ml.model-file=${COMMERCE_ML_MODEL_FILE:}

# SMTP only on production/staging with configured HTTPS frontend.
commerce.mail.enabled=${COMMERCE_MAIL_ENABLED:false}
commerce.mail.from=${COMMERCE_MAIL_FROM:}
commerce.mail.frontend-url=${COMMERCE_FRONTEND_URL:http://localhost:5173}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
