server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:8}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
commerce.cors-origin=${COMMERCE_CORS_ORIGIN:http://localhost:5173}
