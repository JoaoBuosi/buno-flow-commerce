server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orders?currentSchema=flow_commerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:8}
spring.flyway.enabled=true
spring.flyway.schemas=flow_commerce
spring.flyway.default-schema=flow_commerce
spring.flyway.create-schemas=true
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
commerce.cors-origin=${COMMERCE_CORS_ORIGIN:http://localhost:5173}

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

commerce.ml.pilot-enabled=${COMMERCE_ML_PILOT_ENABLED:false}
commerce.ml.model-file=${COMMERCE_ML_MODEL_FILE:}

# Mail is opt-in: SMTP requires outbound TCP/587; Resend uses HTTPS/443.
# Postgres distributed auth IP limiter (enabled only after V5 migration is checked).
commerce.security.ip-rate-limit-enabled=${COMMERCE_IP_RATE_LIMIT_ENABLED:false}
commerce.security.ip-hash-key=${COMMERCE_IP_HASH_KEY:}
# Disabled in existing staging until V6 and key provisioning are validated.
commerce.mfa.owner-required=${COMMERCE_OWNER_MFA_REQUIRED:false}
commerce.mfa.encryption-key=${COMMERCE_MFA_ENCRYPTION_KEY:}
commerce.mail.enabled=${COMMERCE_MAIL_ENABLED:false}
# Keep reset mail limited to one send per account every five minutes by default.
commerce.mail.cooldown-seconds=${COMMERCE_MAIL_COOLDOWN_SECONDS:300}
commerce.mail.provider=${COMMERCE_MAIL_PROVIDER:smtp}
commerce.mail.resend-api-key=${RESEND_API_KEY:}
commerce.mail.from=${COMMERCE_MAIL_FROM:}
commerce.mail.frontend-url=${COMMERCE_FRONTEND_URL:http://localhost:5173}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# E-mail is optional during private staging; do not make API health depend on SMTP.
management.health.mail.enabled=${COMMERCE_MAIL_HEALTH_ENABLED:false}

# Local default remains open for developer tests; Supabase profile enforces invitation.
commerce.pilot-only=${COMMERCE_PILOT_ONLY:false}
commerce.pilot-invite-code=${COMMERCE_PILOT_INVITE_CODE:}
