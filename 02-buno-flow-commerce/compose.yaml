services:
  app:
    build: .
    ports: ["8102:8080"]
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/orders}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-app}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-app}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-update}
      BUNO_TENANT_ID: ${BUNO_TENANT_ID:?Defina BUNO_TENANT_ID}
      BUNO_STORE_API_KEY: ${BUNO_STORE_API_KEY:?Defina BUNO_STORE_API_KEY}
      BUNO_AGENT_API_KEY: ${BUNO_AGENT_API_KEY:?Defina BUNO_AGENT_API_KEY}
      BUNO_APPROVER_API_KEY: ${BUNO_APPROVER_API_KEY:?Defina BUNO_APPROVER_API_KEY}
      BUNO_CORE_API_KEY: ${BUNO_CORE_API_KEY:?Defina BUNO_CORE_API_KEY}
    depends_on:
      db: {condition: service_healthy}
      kafka: {condition: service_started}
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: orders, POSTGRES_USER: app, POSTGRES_PASSWORD: app}
    volumes: ["buno_flow_db:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U app -d orders"], interval: 5s, timeout: 3s, retries: 20}
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
volumes:
  buno_flow_db:
