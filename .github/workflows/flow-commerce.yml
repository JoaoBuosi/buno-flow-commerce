name: Flow Commerce backend integration
on:
  push:
    branches: [feat/commerce-saas-mvp]
  pull_request:
    paths: ['02-buno-flow-commerce/**', '.github/workflows/flow-commerce.yml']
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orders_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d orders_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: 02-buno-flow-commerce
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/orders_test?currentSchema=flow_commerce
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 02-buno-flow-commerce/pom.xml
      - run: mvn -B clean verify
      - name: Verify persistence across process restart
        shell: bash
        run: |
          set -euo pipefail
          java -jar target/buno-flow-commerce-0.2.0-SNAPSHOT.jar > /tmp/commerce-api.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q UP; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/actuator/health | grep -q UP
          LOGIN=$(curl -fsS -X POST http://localhost:8080/api/v1/auth/register -H 'Content-Type: application/json' -d "{\"email\":\"restart-${GITHUB_RUN_ID}@example.test\",\"password\":\"ci-only-strong-password\",\"storeName\":\"Restart Test\"}")
          TOKEN=$(echo "$LOGIN" | jq -r '.accessToken')
          STORE=$(echo "$LOGIN" | jq -r '.storeId')
          CREATED=$(curl -fsS -X POST http://localhost:8080/api/v1/orders -H "Authorization: Bearer $TOKEN" -H "X-Store-Id: $STORE" -H 'Content-Type: application/json' -d '{"customer":"Persist Test","items":[{"sku":"R1","description":"Item","quantity":1,"price":12.34}]}')
          ID=$(echo "$CREATED" | jq -r '.id')
          test -n "$ID" && test "$ID" != null
          kill "$PID"; wait "$PID" 2>/dev/null || true
          java -jar target/buno-flow-commerce-0.2.0-SNAPSHOT.jar > /tmp/commerce-api-restart.log 2>&1 &
          PID=$!
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q UP; then break; fi
            sleep 2
          done
          curl -fsS "http://localhost:8080/api/v1/orders/$ID" -H "Authorization: Bearer $TOKEN" -H "X-Store-Id: $STORE" | jq -e '.customer_name == "Persist Test"'


      - name: Verify PostgreSQL backup and isolated restore
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host -e PGPASSWORD="$SPRING_DATASOURCE_PASSWORD" \
            -v "$PWD:/workspace" postgres:16-alpine \
            pg_dump -h 127.0.0.1 -U app -d orders_test -Fc -f /workspace/backup-ci.dump
          docker run --rm --network host -e PGPASSWORD="$SPRING_DATASOURCE_PASSWORD" postgres:16-alpine \
            createdb -h 127.0.0.1 -U app orders_restore_ci
          docker run --rm --network host -e PGPASSWORD="$SPRING_DATASOURCE_PASSWORD" \
            -v "$PWD:/workspace" postgres:16-alpine \
            pg_restore -h 127.0.0.1 -U app --no-owner --no-acl -d orders_restore_ci /workspace/backup-ci.dump
          docker run --rm --network host -e PGPASSWORD="$SPRING_DATASOURCE_PASSWORD" postgres:16-alpine \
            psql -h 127.0.0.1 -U app -d orders_restore_ci -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM flow_commerce.orders;"
          rm -f backup-ci.dump


      - name: Verify Flyway baseline on Supabase-style prebootstrapped schema
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host -e PGPASSWORD="$SPRING_DATASOURCE_PASSWORD" postgres:16-alpine \
            createdb -h 127.0.0.1 -U app orders_supabase_baseline
          docker run --rm --network host -e PGPASSWORD="$SPRING_DATASOURCE_PASSWORD" postgres:16-alpine \
            psql -h 127.0.0.1 -U app -d orders_supabase_baseline -v ON_ERROR_STOP=1 \
            -c "CREATE SCHEMA flow_commerce;"
          for sql in src/main/resources/db/migration/V1__commerce_core.sql \
                     src/main/resources/db/migration/V2__order_imports.sql \
                     src/main/resources/db/migration/V3__password_reset.sql; do
            docker run --rm --network host -e PGPASSWORD="$SPRING_DATASOURCE_PASSWORD" \
              -e PGOPTIONS="-c search_path=flow_commerce,public" \
              -v "$PWD/src/main/resources/db/migration:/migrations:ro" postgres:16-alpine \
              psql -h 127.0.0.1 -U app -d orders_supabase_baseline -v ON_ERROR_STOP=1 \
              -f "/migrations/$(basename "$sql")"
          done
          SPRING_PROFILES_ACTIVE=supabase \
          SPRING_DATASOURCE_URL='jdbc:postgresql://127.0.0.1:5432/orders_supabase_baseline?currentSchema=flow_commerce' \
          SPRING_DATASOURCE_USERNAME=app \
          SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
          COMMERCE_CORS_ORIGIN=http://localhost:5173 PORT=8091 \
          java -jar target/buno-flow-commerce-0.2.0-SNAPSHOT.jar > /tmp/supabase-baseline.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 50); do
            if curl -fsS http://localhost:8091/actuator/health | grep -q UP; then READY=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$READY" != 1 ]; then
            tail -90 /tmp/supabase-baseline.log
            exit 1
          fi
          RESULT=$(docker run --rm --network host -e PGPASSWORD="$SPRING_DATASOURCE_PASSWORD" postgres:16-alpine \
            psql -h 127.0.0.1 -U app -d orders_supabase_baseline -A -t \
            -c "SELECT version FROM flow_commerce.flyway_schema_history WHERE type='BASELINE' AND success=true LIMIT 1")
          test "$RESULT" = 3

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-buno-flow-commerce/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
