version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/02-buno-flow-commerce"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
  - package-ecosystem: "npm"
    directory: "/02-buno-flow-commerce/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
